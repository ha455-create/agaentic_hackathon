<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#000; --paper:#fff; }
  * { box-sizing:border-box; margin:0 }
  html, body { height:100% }
  body { font-family:Inter, system-ui, -apple-system, sans-serif; background:var(--paper); color:var(--ink) }
  .screen { max-width:430px; height:100%; height:100dvh; margin:0 auto; display:flex; flex-direction:column;
            padding:calc(16px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)) }
  .topbar { display:flex; justify-content:space-between; align-items:center }
  .icon-btn { background:none; border:0; padding:4px; color:var(--ink); cursor:pointer }
  .icon-btn svg { width:34px; height:34px; display:block }

  #thread { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
            display:flex; flex-direction:column; gap:14px; padding:22px 0 }   /* swipeable thread */
  #thread > * { flex-shrink:0 }   /* bubbles keep their full height as the thread grows */
  .ai { align-self:flex-start; max-width:78%; min-height:36px; display:flex; align-items:flex-end; gap:12px;
        background:var(--ink); color:var(--paper); border-radius:18px; padding:9px 12px 9px 16px }
  .ai .text { white-space:normal; font-size:14px; font-weight:500; line-height:1.35; text-align:left }
  .ai.pending { width:180px; justify-content:flex-end }
  .ai.pending { animation:blink 1s infinite }   /* Pulse is preparing an answer */
  @keyframes blink { 50% { opacity:.3 } }
  .ai .text:empty::after { content:'\00a0' }   /* keeps an empty pill one line tall */
  .me { align-self:flex-end; max-width:68%; border:2px solid var(--ink); border-radius:16px;
        padding:8px 16px; font-size:14px; font-weight:500; line-height:1.35; text-align:left; white-space:normal }

  .mic-wrap { display:flex; justify-content:center; padding-top:12px }
  #mic { width:106px; height:106px; border-radius:50%; border:2px solid var(--ink); 
         background:var(--paper); color:var(--ink); display:grid; place-items:center; cursor:pointer;
         transition:background .15s, color .15s }
  #mic svg { width:46px; height:46px }
  #mic.on { background:var(--ink); color:var(--paper) }

  #login { display:flex; flex-direction:column; gap:12px; margin-top:48px }
  #login input { border:2px solid var(--ink); border-radius:999px; padding:12px 16px; font:inherit }
  #login button { background:var(--ink); color:var(--paper); border:0; border-radius:999px; padding:12px; font:inherit; font-weight:600 }
  .hidden { display:none !important }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="icon-btn" id="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.6 3.8-7.8 8.5-7.8s8.5 3.2 8.5 7.8"/></svg>
    </button>
    <button class="icon-btn" id="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
        <circle cx="8" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></svg>
    </button>
  </div>

  <form id="login" class="hidden">
    <input id="email" type="email" placeholder="email" autocomplete="email">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>

  <div id="thread" class="hidden"></div>

  <div class="mic-wrap hidden" id="micWrap">
    <button id="mic" aria-label="Talk to Pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wumnthpdoqswdtpbunev.supabase.co'
const SUPABASE_KEY = 'sb_publishable_tIT2i2raWHj1kidB0GtzbQ_1erB27Mz'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const $ = (id) => document.getElementById(id)

// Tidy text for a pill: drop stray spaces and line breaks, start with a capital, end as a full sentence
const tidy = (s) => {
  const t = String(s ?? '').replace(/\s+/g, ' ').trim()
  if (!t) return t
  const c = t[0].toUpperCase() + t.slice(1)
  return /[.!?"'\u201d\u2019)]$/.test(c) ? c : c + '.'
}
const todayNY = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date())

const player = new Audio()
const audioCache = new Map() // text -> object URL, so a replay does not call TTS again
let recog = null
const waiting = new Map() // ai_charts row id -> { bubble, text } until ai_response arrives
const early = new Map()   // answers that arrive before the question finished rolling out
let me = null             // the signed-in user; me.id is the uuid posted with every question
let demo = []             // scripted turns from demo_script (Step 7)
let turn = 0              // the next scripted turn

// ---------- auth ----------
$('login').onsubmit = async (e) => {
  e.preventDefault()
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value })
  if (error) return alert(error.message)
  boot()
}
sb.auth.getSession().then(({ data }) => data.session ? boot() : $('login').classList.remove('hidden'))

async function boot() {
  $('login').classList.add('hidden')
  $('thread').classList.remove('hidden')
  $('micWrap').classList.remove('hidden')

  // 1a. Demo script (Step 7): start on an empty screen and pre-load the voice of every scripted answer
  demo = (await sb.from('demo_script').select('user_text, pulse_text').order('position')).data ?? []
  if (demo.length) {
    preload(demo.map((t) => tidy(t.pulse_text)))
  } else {

  // 1b. Otherwise today's brief. The first open of the day builds it live from city data
  let { data: brief } = await sb.from('briefs').select('greeting, opportunities, obstacles').eq('day', todayNY()).maybeSingle()
  if (!brief) {
    const wait = aiBubble() // empty black pill while Pulse reads the city data
    brief = (await sb.functions.invoke('pulse', { body: { action: 'brief' } })).data
    wait.remove()
  }
  if (brief?.greeting) aiBubble(brief.greeting)
  for (const item of [...(brief?.opportunities ?? []), ...(brief?.obstacles ?? [])]) aiBubble(item.text)
  }

  // 2. Today's conversation from ai_charts
  const since = new Date(); since.setHours(0, 0, 0, 0)
  const { data: rows } = await sb.from('ai_charts').select('user_prompt, ai_response')
    .gte('created_at', since.toISOString()).order('created_at')
  if (!demo.length) for (const r of rows ?? []) { meBubble(r.user_prompt, true); aiBubble(r.ai_response) } // the demo starts clean

  // 3. Hear ai_response arrive in real time
  me = (await sb.auth.getUser()).data.user
  sb.channel('ai_charts')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'ai_charts', filter: `user_id=eq.${me.id}` },
      (change) => onAnswer(change.new))
    .subscribe()
}

// ---------- bubbles ----------
// Stick to the newest line, like a chat app. Swiping up to read turns that off;
// coming back to the bottom, or asking a new question, turns it back on.
let stick = true
function scrollDown(force = false) {
  const t = $('thread')
  if (force) stick = true
  if (stick) t.scrollTop = t.scrollHeight
}
$('thread').addEventListener('scroll', () => {
  const t = $('thread')
  stick = t.scrollHeight - t.scrollTop - t.clientHeight < 40
})

// William's question: rolls out word by word, or appears at once for past rows
function meBubble(text, instant = false) {
  const el = document.createElement('div')
  el.className = 'me'
  $('thread').append(el)
  if (instant) { el.textContent = tidy(text); scrollDown(); return Promise.resolve() }
  return rollOut(el, tidy(text))
}

function rollOut(el, text, msPerWord = 110) {
  const words = text.split(' ')
  return new Promise((resolve) => {
    let i = 0
    const tick = () => {
      el.textContent = words.slice(0, ++i).join(' ')
      scrollDown()
      if (i < words.length) setTimeout(tick, msPerWord); else resolve()
    }
    tick()
  })
}

function aiBubble(text = '') {
  const el = document.createElement('div')
  el.className = text ? 'ai' : 'ai pending'
  el.innerHTML = `<span class="text"></span>`
  setText(el, text)
  $('thread').append(el)
  scrollDown()
  return el
}

function setText(el, text) {
  text = tidy(text)
  el.dataset.full = text
  el.title = text
  el.querySelector('.text').textContent = text
  if (text) el.classList.remove('pending')
}

// ---------- voice out (Gemini TTS through pulse) ----------
function play(src) {
  return new Promise((resolve) => { player.src = src; player.onended = resolve; player.play() })
}

// Phones only allow sound after a tap: a silent clip on the first mic press lets every answer play by itself
let unlocked = false
function unlockAudio() {
  if (unlocked) return
  unlocked = true
  player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='
  player.play().catch(() => {})
}

// Fetch the voice once per text and keep it, so a second click plays instantly
function getAudio(text) {
  if (!audioCache.has(text)) audioCache.set(text, (async () => {
    const { data: { session } } = await sb.auth.getSession()
    const res = await fetch(`${SUPABASE_URL}/functions/v1/pulse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY,
                 Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'speak', text }) })
    if (!res.ok) { audioCache.delete(text); throw new Error('TTS failed') }
    return URL.createObjectURL(new Blob([await res.arrayBuffer()], { type: 'audio/wav' }))
  })())
  return audioCache.get(text)
}

async function speak(text) {
  return play(await getAudio(text))
}

// Load the voice of every scripted answer one at a time, before the demo starts
async function preload(texts) {
  for (const t of texts) { try { await getAudio(t) } catch {} }
}

// Play the voice and roll the text out in step with it, word by word
let stopRoll = null
async function speakInto(el, text) {
  if (stopRoll) stopRoll()                 // finish any answer that is still rolling
  const out = el.querySelector('.text')
  el.classList.remove('pending')
  el.classList.add('open')
  let url
  try { url = await getAudio(text) } catch { out.textContent = text; return } // no voice: show it all
  const words = text.split(' ')
  out.textContent = ''
  return new Promise((resolve) => {
    let frame
    const finish = () => { cancelAnimationFrame(frame); out.textContent = text; stopRoll = null; resolve() }
    stopRoll = finish
    const step = () => {
      const d = player.duration
      if (d && isFinite(d)) out.textContent = words.slice(0, Math.ceil(words.length * player.currentTime / d)).join(' ')
      scrollDown()
      frame = requestAnimationFrame(step)
    }
    player.src = url
    player.onended = finish
    player.onerror = finish
    player.play().then(step).catch(finish)
  })
}

// ---------- voice in (press to start, press again to stop and send) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
let heard = ''

$('mic').onclick = () => {
  if (recog) return recog.stop() // second press stops recording and sends
  unlockAudio()
  if (!SR) {
    if (turn < demo.length) return ask(demo[turn++].user_text)
    const t = prompt('Type your question'); if (t) ask(t); return
  }
  heard = ''
  recog = new SR()
  recog.lang = 'en-US'
  recog.continuous = true        // keep recording until the second press
  recog.interimResults = false
  recog.onresult = (ev) => {
    for (let i = ev.resultIndex; i < ev.results.length; i++)
      if (ev.results[i].isFinal) heard += ev.results[i][0].transcript + ' '
  }
  recog.onend = () => {
    recog = null
    $('mic').classList.remove('on')
    if (turn < demo.length) return ask(demo[turn++].user_text) // demo: send the next scripted line, whatever was said
    if (heard.trim()) ask(heard.trim()) // otherwise send what was heard, as is
  }
  $('mic').classList.add('on')     // filled black while recording
  recog.start()
}

// ---------- ask Pulse: insert into ai_charts, wait for ai_response ----------
async function ask(text) {
  const asked = Date.now()                             // when the presenter finished asking
  const saved = sb.from('ai_charts')
    .insert({ user_id: me.id, user_prompt: text })   // the user's uuid plus what they said
    .select('id').single()
    .then((r) => r)                                    // starts saving right away
  scrollDown(true)                                     // a new question snaps back to the newest line
  await meBubble(text)                                 // the question rolls out word by word
  const bubble = aiBubble()                            // then an empty black pill until ai_response arrives
  const { data: row, error } = await saved
  if (error) return setText(bubble, 'Sorry, I could not get that.')
  waiting.set(row.id, { bubble, text })
  if (early.has(row.id)) onAnswer(early.get(row.id))
  // Demo (Step 7): 2 seconds after the presenter finishes asking, write the scripted answer into
  // ai_charts.ai_response, then Pulse reads it aloud. Realtime sees the same update; onAnswer plays it once.
  const line = demo.find((t) => t.user_text === text)
  if (line) setTimeout(async () => {
    await sb.from('ai_charts').update({ ai_response: line.pulse_text }).eq('id', row.id).is('ai_response', null)
    onAnswer({ id: row.id, ai_response: line.pulse_text })
  }, Math.max(0, 2000 - (Date.now() - asked)))
}

// Called by Realtime when pulse or the MCP tool writes ai_response into a row
async function onAnswer(row) {
  const w = waiting.get(row.id)
  if (!row.ai_response) return
  if (!w) { if (!early.has(row.id)) early.set(row.id, row); return } // arrived while the question was still rolling out
  waiting.delete(row.id)
  const reply = tidy(row.ai_response)
  w.bubble.dataset.full = reply
  w.bubble.title = reply
  await speakInto(w.bubble, reply) // the text rolls out as Pulse speaks
  if (/podcast/i.test(w.text)) { // podcast answer: play the commute episode next
    const { data: b } = await sb.from('briefs').select('episode_path').eq('day', todayNY()).maybeSingle()
    if (b?.episode_path) {
      const { data: s } = await sb.storage.from('audio').createSignedUrl(b.episode_path, 3600)
      play(s.signedUrl)
    }
  }
}
</script>
</body>
</html>
