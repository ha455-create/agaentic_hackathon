<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#000; --paper:#fff; }
  * { box-sizing:border-box; margin:0 }
  html, body { height:100% }
  body { font-family:Inter, system-ui, -apple-system, sans-serif; background:var(--paper); color:var(--ink) }
  .screen { max-width:430px; height:100%; margin:0 auto; display:flex; flex-direction:column;
            padding:calc(16px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)) }
  .topbar { display:flex; justify-content:space-between; align-items:center }
  .icon-btn { background:none; border:0; padding:4px; color:var(--ink); cursor:pointer }
  .icon-btn svg { width:34px; height:34px; display:block }

  #thread { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:22px 0 }
  .ai { align-self:flex-start; max-width:78%; min-height:36px; display:flex; align-items:center; gap:12px;
        background:var(--ink); color:var(--paper); border-radius:999px; padding:8px 12px 8px 16px }
  .ai .text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; font-weight:500 }
  .ai.pending { width:180px; justify-content:flex-end }
  .ai.pending .speak { animation:blink 1s infinite }
  @keyframes blink { 50% { opacity:.3 } }
  .speak { flex:none; background:none; border:0; padding:0; color:var(--paper); cursor:pointer; display:flex }
  .speak svg { width:22px; height:22px }
  .me { align-self:flex-end; max-width:68%; border:2px solid var(--ink); border-radius:16px;
        padding:7px 16px; font-size:14px; font-weight:500; line-height:1.3; text-align:center }

  .mic-wrap { display:flex; justify-content:center; padding-top:12px }
  #mic { width:106px; height:106px; border-radius:50%; border:2px solid var(--ink); 
         background:var(--paper); color:var(--ink); display:grid; place-items:center; cursor:pointer;
         transition:background .15s, color .15s }
  #mic svg { width:46px; height:46px }
  #mic.on { background:var(--ink); color:var(--paper) }

  #login { display:flex; flex-direction:column; gap:12px; margin-top:48px }
  #login input { border:2px solid var(--ink); border-radius:999px; padding:12px 16px; font:inherit }
  #login button { background:var(--ink); color:var(--paper); border:0; border-radius:999px; padding:12px; font:inherit; font-weight:600 }
  .hidden { display:none !important }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="icon-btn" id="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.6 3.8-7.8 8.5-7.8s8.5 3.2 8.5 7.8"/></svg>
    </button>
    <button class="icon-btn" id="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18"/>
        <circle cx="8" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></svg>
    </button>
  </div>

  <form id="login" class="hidden">
    <input id="email" type="email" placeholder="email" autocomplete="email">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>

  <div id="thread" class="hidden"></div>

  <div class="mic-wrap hidden" id="micWrap">
    <button id="mic" aria-label="Talk to Pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://YOUR-REF.supabase.co'
const SUPABASE_KEY = 'YOUR-PUBLISHABLE-KEY'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const $ = (id) => document.getElementById(id)
const todayNY = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date())
const SPEAKER = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3l5-4v14l-5-4H4z"/>
  <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`

const player = new Audio()
const audioCache = new Map() // text -> object URL, so a replay does not call TTS again
let recog = null

// ---------- auth ----------
$('login').onsubmit = async (e) => {
  e.preventDefault()
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value })
  if (error) return alert(error.message)
  boot()
}
sb.auth.getSession().then(({ data }) => data.session ? boot() : $('login').classList.remove('hidden'))

async function boot() {
  $('login').classList.add('hidden')
  $('thread').classList.remove('hidden')
  $('micWrap').classList.remove('hidden')

  // 1. Today's brief. The first open of the day builds it live from city data (a few seconds)
  let { data: brief } = await sb.from('briefs').select('greeting, opportunities, obstacles').eq('day', todayNY()).maybeSingle()
  if (!brief) {
    const wait = aiBubble() // empty black pill while Pulse reads the city data
    brief = (await sb.functions.invoke('pulse', { body: { action: 'brief' } })).data
    wait.remove()
  }
  if (brief?.greeting) aiBubble(brief.greeting)
  for (const item of [...(brief?.opportunities ?? []), ...(brief?.obstacles ?? [])]) aiBubble(item.text)

  // 2. Today's conversation from ai_charts
  const since = new Date(); since.setHours(0, 0, 0, 0)
  const { data: rows } = await sb.from('ai_charts').select('user_prompt, ai_response')
    .gte('created_at', since.toISOString()).order('created_at')
  for (const r of rows ?? []) { meBubble(r.user_prompt); aiBubble(r.ai_response) }
}

// ---------- bubbles ----------
function scrollDown() { $('thread').scrollTop = $('thread').scrollHeight }

function meBubble(text) {
  const el = document.createElement('div')
  el.className = 'me'
  el.textContent = text
  $('thread').append(el)
  scrollDown()
}

function aiBubble(text = '') {
  const el = document.createElement('div')
  el.className = text ? 'ai' : 'ai pending'
  el.innerHTML = `<span class="text"></span><button class="speak" aria-label="Play">${SPEAKER}</button>`
  setText(el, text)
  el.querySelector('.speak').onclick = () => el.dataset.full && speak(el.dataset.full)
  $('thread').append(el)
  scrollDown()
  return el
}

function setText(el, text) {
  el.dataset.full = text
  el.title = text
  el.querySelector('.text').textContent = text
  if (text) el.classList.remove('pending')
}

// ---------- voice out (Gemini TTS through pulse) ----------
function play(src) {
  return new Promise((resolve) => { player.src = src; player.onended = resolve; player.play() })
}

async function speak(text) {
  let url = audioCache.get(text)
  if (!url) {
    const { data: { session } } = await sb.auth.getSession()
    const res = await fetch(`${SUPABASE_URL}/functions/v1/pulse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY,
                 Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'speak', text }) })
    url = URL.createObjectURL(new Blob([await res.arrayBuffer()], { type: 'audio/wav' }))
    audioCache.set(text, url)
  }
  return play(url)
}

// ---------- voice in (press to start, press again to stop and send) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
let heard = ''

$('mic').onclick = () => {
  if (recog) return recog.stop() // second press stops recording and sends
  if (!SR) { const t = prompt('Type your question'); if (t) ask(t); return }
  heard = ''
  recog = new SR()
  recog.lang = 'en-US'
  recog.continuous = true        // keep recording until the second press
  recog.interimResults = false
  recog.onresult = (ev) => {
    for (let i = ev.resultIndex; i < ev.results.length; i++)
      if (ev.results[i].isFinal) heard += ev.results[i][0].transcript + ' '
  }
  recog.onend = () => {
    recog = null
    $('mic').classList.remove('on')
    if (heard.trim()) ask(heard.trim()) // send what was heard, as is
  }
  $('mic').classList.add('on')     // filled black while recording
  recog.start()
}

// ---------- ask Pulse ----------
async function ask(text) {
  meBubble(text)
  const bubble = aiBubble() // empty black pill while Pulse answers
  try {
    const { data, error } = await sb.functions.invoke('pulse', { body: { action: 'ask', prompt: text } })
    if (error) throw error
    setText(bubble, data.answer)
    await speak(data.answer)
    if (data.episode) { // podcast answer: play the generated episode next
      const { data: s } = await sb.storage.from('audio').createSignedUrl(data.episode, 3600)
      play(s.signedUrl)
    }
  } catch (err) {
    setText(bubble, 'Sorry, I could not get that.')
  }
}
</script>
</body>
</html>
